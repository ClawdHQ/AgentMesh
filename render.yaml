services:
  - type: web
    name: agentmesh-api
    runtime: node
    repo: https://github.com/ClawdHQ/AgentMesh
    plan: free
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: CHAIN_ID
        value: 11155111
      - key: AUTONOMY_LEVEL
        value: 2
      - key: API_HOST
        value: 0.0.0.0
      - key: FILECOIN_STORAGE_PROVIDER
        value: lighthouse
      - key: PUBLIC_DASHBOARD_URL
        value: https://agent-mesh-os.vercel.app
      - key: PUBLIC_API_URL
        value: https://agentmesh-api.onrender.com
      - key: VITE_DASHBOARD_ORIGIN
        value: https://agent-mesh-os.vercel.app
      - key: ORCHESTRATOR_PORT
        value: 10001
      - key: SPECIALIST_AGENTS_PORT
        value: 10002
      - key: VENDOR_AGENT_PORT
        value: 10003
      - key: ORCHESTRATOR_SERVICE_URL
        value: http://127.0.0.1:10001
      - key: SPECIALIST_SERVICE_URL
        value: http://127.0.0.1:10002
      - key: VENDOR_SERVICE_URLS
        value: http://127.0.0.1:10003
      - key: INTERNAL_SERVICE_API_KEY
        generateValue: true
      - key: PRIVATE_KEY
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: AGENT_REGISTRY_ADDRESS
        sync: false
      - key: TASK_ESCROW_ADDRESS
        sync: false
      - key: REPUTATION_ORACLE_ADDRESS
        sync: false
      - key: AUDIT_LOGGER_ADDRESS
        sync: false
      - key: LIGHTHOUSE_API_KEY
        sync: false
      - key: LIGHTHOUSE_GATEWAY_URL
        sync: false
      - key: FILECOIN_PIN_COMMAND
        sync: false
      - key: FILECOIN_PIN_GATEWAY_URL
        sync: false
      - key: LIT_NETWORK
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: IMPULSE_API_KEY
        sync: false
      - key: IMPULSE_DEPLOYMENT_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
